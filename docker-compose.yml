# Local development database. Docker runs SQL Server only; the API and the front end
# run natively so you can debug them normally.
#
#   cp .env.example .env
#   docker compose up -d
#
# Apple Silicon Macs: this image is built for x86_64 only. Turn on
# "Use Rosetta for x86_64/amd64 emulation on Apple Silicon" in Docker Desktop
# (Settings > General) before starting it. It runs a little slower than native,
# which doesn't matter for development.
services:
  sqlserver:
    # Pinned to an exact cumulative update so everyone (and CI) runs the same build.
    # Upgrade on purpose by changing this tag here and in .github/workflows/ci.yml.
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example to .env)}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # $$ escapes Compose interpolation, so the shell inside the container expands the variable.
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data:
