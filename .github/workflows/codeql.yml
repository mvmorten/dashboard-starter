name: CodeQL

# GitHub's code scanning: reads the C#, TypeScript, and workflow files looking for security
# bugs (SQL injection, XSS, path traversal, unsafe workflow patterns) and shows findings in
# the Security tab and on the pull request. Free for public repositories.
#
# Separate from CI on purpose: it's slower than the build, and a finding shows up as its own
# check on the pull request instead of turning the whole CI run red.

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so new CodeQL queries run against code that hasn't changed.
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Uploads the results to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: CodeQL reads the source directly, so this job needs no SQL Server,
        # no npm install, and no dotnet build. Slightly less precise for C# than a full build,
        # and much simpler.
        language: [csharp, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The default queries plus the extended security set. Code-quality-only queries
          # stay off; .editorconfig, warnings as errors, and ESLint already cover style.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
