name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand on main to redeploy without a new commit (checks first, then deploy).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request makes the old run pointless, so cancel it. On main the run
  # ends in a deploy, which must never be cut off halfway, so main runs queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds the .NET solution, then proves the schema workflow against a real SQL Server:
  # the API refuses to start before migrations, migrate is idempotent, seed reruns cleanly,
  # the health endpoint answers, and an edited migration is caught.
  dotnet:
    name: dotnet
    runs-on: ubuntu-24.04
    services:
      sqlserver:
        # Same image as docker-compose.yml. Change both together.
        image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          # The same dev-only password as .env.example, so the Db runner and the API
          # use their built-in Development connection strings unchanged. This container
          # lives only for this job and isn't reachable from outside it.
          MSSQL_SA_PASSWORD: LocalDevOnly!ChangeMe1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Warnings are errors (Directory.Build.props), except NuGet audit warnings,
      # which still print here so a new advisory is visible on the PR.
      - name: Build
        run: dotnet build --configuration Release

      - name: API refuses to start before migrations
        run: |
          set +e
          timeout 60 dotnet run --no-build --configuration Release --project src/Api
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected the API to exit with code 1, got $code."
            exit 1
          fi

      - name: Migrate (first run applies everything)
        run: dotnet run --no-build --configuration Release --project src/Db -- migrate

      - name: Migrate again (second run skips everything)
        run: |
          output=$(dotnet run --no-build --configuration Release --project src/Db -- migrate)
          echo "$output"
          echo "$output" | grep -q "Migrations: 0 applied"

      - name: Seed twice
        run: |
          dotnet run --no-build --configuration Release --project src/Db -- seed
          dotnet run --no-build --configuration Release --project src/Db -- seed

      # Accounts for the sign-in checks below. Passwords go in on standard input, never as
      # arguments. weak@example.com is hashed with weaker settings on purpose, so signing in
      # can prove the API rehashes it.
      - name: Create users
        run: |
          db="dotnet run --no-build --configuration Release --project src/Db --"
          echo 'a-long-enough-password' | $db create-user --email ann@example.com --name "Ann Example" --tenant "Acme Corporation" --password-stdin
          echo 'a-long-enough-password' | $db create-user --email ann@example.com --name "Ann Example" --tenant "Globex Industries" --password-stdin
          echo 'a-long-enough-password' | $db create-user --email locked@example.com --name "Locked Out" --tenant "Acme Corporation" --password-stdin
          echo 'a-long-enough-password' | PasswordHashing__Iterations=1 $db create-user --email weak@example.com --name "Weak Hash" --password-stdin

          # A password on the command line is refused outright.
          if $db set-password --email ann@example.com --password oops; then
            echo "set-password accepted a password argument."
            exit 1
          fi

          # Stored as a PHC string with the configured settings.
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -h -1 -W -d DashboardStarter -U sa -P LocalDevOnly!ChangeMe1"
          $sqlcmd -Q "SET NOCOUNT ON; SELECT PasswordHash FROM dbo.Users WHERE Email = 'ann@example.com';" | grep -q '^\$argon2id\$v=19\$m=19456,t=2,p=1\$'
          $sqlcmd -Q "SET NOCOUNT ON; SELECT PasswordHash FROM dbo.Users WHERE Email = 'weak@example.com';" | grep -q '^\$argon2id\$v=19\$m=19456,t=1,p=1\$'

      - name: Demo account (twice; the second run changes nothing)
        env:
          DEMO_PASSWORD: published-demo-pass
        run: |
          dotnet run --no-build --configuration Release --project src/Db -- demo
          output=$(dotnet run --no-build --configuration Release --project src/Db -- demo)
          echo "$output"
          echo "$output" | grep -q "exists   tenant Demo"
          echo "$output" | grep -q "exists   user guest@example.com"
          echo "$output" | grep -q "unchanged password"

      # The API connects with its own login, which can read and write data but not change
      # the schema (sql/migrations/0005_app_runtime_role.sql). Prove both halves.
      - name: Create the API's login
        env:
          APP_DB_USER: dashboard_app
          APP_DB_PASSWORD: AppDevOnly!ChangeMe1
        run: |
          dotnet run --no-build --configuration Release --project src/Db -- app-user
          # Twice: the second run resets the password and must also succeed.
          dotnet run --no-build --configuration Release --project src/Db -- app-user

      - name: The API's login can read data but can't change the schema
        run: |
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -d DashboardStarter -U dashboard_app -P AppDevOnly!ChangeMe1"
          $sqlcmd -Q "SELECT COUNT(*) FROM dbo.Tenants;"
          if $sqlcmd -Q "CREATE TABLE dbo.ShouldNotExist (Id int);"; then
            echo "The app login was able to create a table."
            exit 1
          fi
          echo "CREATE TABLE was refused, as it should be."

      # Keeps running in the background for the sign-in checks. SessionCheckSeconds=2 lets the
      # set-password check see the session end in seconds rather than a minute, and a higher
      # sign-in limit leaves room for the lockout checks before the rate-limit check.
      - name: API starts and reports healthy (as the app login)
        env:
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=DashboardStarter;User Id=dashboard_app;Password=AppDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
          Auth__SessionCheckSeconds: "2"
          Auth__SignInPermitLimit: "50"
        run: |
          dotnet run --no-build --configuration Release --project src/Api > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:5080/api/health -o health.json; then
              break
            fi
            sleep 1
          done
          cat api.log
          cat health.json
          grep -q '"status":"Healthy"' health.json

      # Sign in and out, wrong passwords, lockout, the demo account, antiforgery, switching
      # tenants, SESSION_CONTEXT, set-password ending a session, and the rate limit.
      - name: Sign-in checks
        env:
          DB: dotnet run --no-build --configuration Release --project src/Db --
        run: bash .github/scripts/auth-checks.sh

      - name: Signing in rehashed the weaker hash
        run: |
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -h -1 -W -d DashboardStarter -U sa -P LocalDevOnly!ChangeMe1"
          $sqlcmd -Q "SET NOCOUNT ON; SELECT PasswordHash FROM dbo.Users WHERE Email = 'weak@example.com';" | grep -q '^\$argon2id\$v=19\$m=19456,t=2,p=1\$'

      # Outside Development the API also serves the React build. Deep links (/health) must
      # get index.html, but a mistyped API path or a missing file must stay a real 404.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Build the front end into the API's wwwroot
        run: |
          npm ci --prefix src/Web
          npm run build --prefix src/Web
          mkdir -p src/Api/wwwroot
          cp -r src/Web/dist/. src/Api/wwwroot/

      # Also the production cookie and HTTPS settings. ASPNETCORE_FORWARDEDHEADERS_ENABLED is
      # what the deploy sets on App Service, so a request with X-Forwarded-Proto: https counts
      # as HTTPS here, the way one that came through Azure's front end does.
      - name: Production mode (SPA fallback, cookies, HSTS)
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5081
          ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=DashboardStarter;User Id=dashboard_app;Password=AppDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
        run: |
          # --no-launch-profile: the profile in launchSettings.json forces Development and port
          # 5080, which would ignore the settings above and clash with the API from the
          # previous step.
          dotnet run --no-build --no-launch-profile --configuration Release --project src/Api > api-prod.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:5081/api/health -o /dev/null; then
              break
            fi
            sleep 1
          done
          cat api-prod.log

          # A React route that isn't a file: 200 and the page.
          curl -sf http://localhost:5081/health | grep -q '<div id="root">'

          # Unknown API paths: 404 and JSON, never the page.
          status=$(curl -s -o api-404.json -w '%{http_code}' http://localhost:5081/api/nope)
          [ "$status" = "404" ]
          grep -q '"status":404' api-404.json
          # (An if, not "! grep": bash's -e ignores a command that starts with !, so that
          # form could never fail the step.)
          if grep -q '<div id="root">' api-404.json; then
            echo "An unknown API path got the page."
            exit 1
          fi

          # A missing file: a real 404, not the page.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5081/missing.js)
          [ "$status" = "404" ]

          # Signed out: the API answers 401 as JSON, never a redirect to a login page.
          status=$(curl -s -o me.json -w '%{http_code}' http://localhost:5081/api/auth/me)
          [ "$status" = "401" ]
          grep -q '"status":401' me.json

          # No demo account configured: the sign-in page shows none.
          curl -sf http://localhost:5081/api/auth/sign-in-info | grep -q '"demoAccount":null'

          # Deployed cookies: __Host- names, Secure, HttpOnly where script mustn't read them.
          https="-H X-Forwarded-Proto:https"
          curl -sf $https -D af.txt -c jar -b jar -o /dev/null http://localhost:5081/api/auth/antiforgery
          cat af.txt
          grep -qi '^set-cookie: __Host-ds-af=.*; secure; samesite=strict; httponly' af.txt
          grep -qi '^set-cookie: __Host-ds-xsrf=.*; secure; samesite=strict' af.txt
          token=$(awk '$6 == "__Host-ds-xsrf" { print $7 }' jar)
          curl -s $https -D signin.txt -c jar -b jar -o /dev/null -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            -d '{"email":"guest@example.com","password":"published-demo-pass"}' http://localhost:5081/api/auth/sign-in
          cat signin.txt
          grep -q '^HTTP/1.1 200' signin.txt
          grep -qi '^set-cookie: __Host-ds-auth=.*; secure; samesite=lax; httponly' signin.txt
          curl -sf $https -b jar http://localhost:5081/api/auth/me | grep -q '"isDemo":true'

          # HSTS on HTTPS requests, without includeSubDomains or preload. (Never sent to
          # localhost, so this asks for another host name.)
          curl -s $https -H 'Host: dashboard.example.com' -D hsts.txt -o /dev/null http://localhost:5081/api/health
          grep -i '^strict-transport-security: max-age=31536000' hsts.txt
          if grep -qi 'includesubdomains\|preload' hsts.txt; then
            echo "HSTS must not include subdomains or preload."
            exit 1
          fi

      - name: Editing an applied migration makes migrate fail
        run: |
          echo "-- edited after it was applied" >> sql/migrations/0001_tenants.sql
          dotnet build src/Db --configuration Release
          set +e
          output=$(dotnet run --no-build --configuration Release --project src/Db -- migrate)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 1 ]; then
            echo "Expected migrate to exit with code 1, got $code."
            exit 1
          fi
          echo "$output" | grep -q "edited after it was applied"

  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  # Ships main to Azure once both checks pass (.github/workflows/deploy.yml).
  # Runs on a push to main, or a manual run of CI on main. Skipped on pull requests, and
  # in any fork that hasn't set up its own Azure (no AZURE_WEBAPP_NAME variable), so forks
  # stay green without an Azure account.
  deploy:
    name: deploy
    needs: [dotnet, web]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
