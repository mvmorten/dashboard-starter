name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand on main to redeploy without a new commit (checks first, then deploy).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request makes the old run pointless, so cancel it. On main the run
  # ends in a deploy, which must never be cut off halfway, so main runs queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds the .NET solution, then proves the schema workflow against a real SQL Server:
  # the API refuses to start before migrations, migrate is idempotent, seed reruns cleanly,
  # the health endpoint answers, and an edited migration is caught.
  dotnet:
    name: dotnet
    runs-on: ubuntu-24.04
    services:
      sqlserver:
        # Same image as docker-compose.yml. Change both together.
        image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          # The same dev-only password as .env.example, so the Db runner and the API
          # use their built-in Development connection strings unchanged. This container
          # lives only for this job and isn't reachable from outside it.
          MSSQL_SA_PASSWORD: LocalDevOnly!ChangeMe1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Warnings are errors (Directory.Build.props), except NuGet audit warnings,
      # which still print here so a new advisory is visible on the PR.
      - name: Build
        run: dotnet build --configuration Release

      - name: API refuses to start before migrations
        run: |
          set +e
          timeout 60 dotnet run --no-build --configuration Release --project src/Api
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected the API to exit with code 1, got $code."
            exit 1
          fi

      - name: Migrate (first run applies everything)
        run: dotnet run --no-build --configuration Release --project src/Db -- migrate

      - name: Migrate again (second run skips everything)
        run: |
          output=$(dotnet run --no-build --configuration Release --project src/Db -- migrate)
          echo "$output"
          echo "$output" | grep -q "Migrations: 0 applied"

      # seed makes the local account admin@example.com (src/Db/Users/LocalAccount.cs): an
      # ordinary account with a password, Member in Acme and Admin in Globex (Acme's admins are the
      # role checks' own boss and boss2). Twice: the second
      # run changes nothing. There's no demo account any more; "Try the demo" makes sandboxes.
      - name: Seed twice (the local account comes out the same both times)
        run: |
          db="dotnet run --no-build --configuration Release --project src/Db --"
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -h -1 -W -s | -d DashboardStarter -U sa -P LocalDevOnly!ChangeMe1"
          query="SET NOCOUNT ON;
            SELECT u.Id, u.Email, u.IsDemo, t.Name, tu.Status, r.Name
            FROM dbo.TenantUsers AS tu
            INNER JOIN dbo.Users AS u ON u.Id = tu.UserId
            INNER JOIN dbo.Tenants AS t ON t.Id = tu.TenantId
            INNER JOIN dbo.Roles AS r ON r.Id = tu.RoleId
            WHERE u.Email = 'admin@example.com'
            ORDER BY t.Name;"

          $db seed
          $sqlcmd -Q "$query" > local-account.txt
          cat local-account.txt
          grep -q '|admin@example.com|0|Acme Corporation|Active|Member$' local-account.txt
          grep -q '|admin@example.com|0|Globex Industries|Active|Admin$' local-account.txt
          [ "$(wc -l < local-account.txt)" -eq 2 ]
          # No demo rows: seed doesn't make any.
          [ "$($sqlcmd -Q "SET NOCOUNT ON; SELECT (SELECT COUNT(*) FROM dbo.Users WHERE IsDemo = 1) + (SELECT COUNT(*) FROM dbo.Tenants WHERE IsDemo = 1);")" = 0 ]

          output=$($db seed)
          echo "$output"
          echo "$output" | grep -q "unchanged password"
          $sqlcmd -Q "$query" | diff local-account.txt -

      # Accounts for the sign-in checks below. Passwords go in on standard input, never as
      # arguments. weak@example.com is hashed with weaker settings on purpose, so signing in
      # can prove the API rehashes it.
      - name: Create users
        run: |
          db="dotnet run --no-build --configuration Release --project src/Db --"
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -h -1 -W -d DashboardStarter -U sa -P LocalDevOnly!ChangeMe1"
          echo 'a-long-enough-password' | $db create-user --email ann@example.com --name "Ann Example" --tenant "Acme Corporation" --password-stdin
          echo 'a-long-enough-password' | $db create-user --email ann@example.com --name "Ann Example" --tenant "Globex Industries" --password-stdin
          echo 'a-long-enough-password' | $db create-user --email locked@example.com --name "Locked Out" --tenant "Acme Corporation" --password-stdin
          echo 'a-long-enough-password' | PasswordHashing__Iterations=1 $db create-user --email weak@example.com --name "Weak Hash" --password-stdin

          # For the role checks (role-checks.sh). create-user without --role gives the default
          # role, Member.
          echo 'a-long-enough-password' | $db create-user --email boss@example.com --name "Boss Example" --tenant "Acme Corporation" --role Admin --password-stdin
          echo 'a-long-enough-password' | $db create-user --email boss2@example.com --name "Boss Two" --tenant "Acme Corporation" --role Admin --password-stdin
          echo 'a-long-enough-password' | $db create-user --email mem@example.com --name "Mem Example" --tenant "Acme Corporation" --password-stdin
          echo 'a-long-enough-password' | $db create-user --email mem@example.com --name "Mem Example" --tenant "Globex Industries" --password-stdin
          echo 'a-long-enough-password' | $db create-user --email ro@example.com --name "Ro Example" --tenant "Acme Corporation" --role read-only --password-stdin

          # For the customer checks (customer-checks.sh): one user per role, and cmem in a second
          # tenant for the isolation checks.
          echo 'a-long-enough-password' | $db create-user --email cadmin@example.com --name "Customer Admin" --tenant "Acme Corporation" --role Admin --password-stdin
          echo 'a-long-enough-password' | $db create-user --email cmem@example.com --name "Customer Member" --tenant "Acme Corporation" --password-stdin
          echo 'a-long-enough-password' | $db create-user --email cmem@example.com --name "Customer Member" --tenant "Globex Industries" --password-stdin
          echo 'a-long-enough-password' | $db create-user --email cro@example.com --name "Customer Reader" --tenant "Acme Corporation" --role Read-only --password-stdin

          # For the password reset checks (password-checks.sh).
          echo 'a-long-enough-password' | $db create-user --email reset@example.com --name "Reset Example" --tenant "Acme Corporation" --password-stdin
          echo 'a-long-enough-password' | $db create-user --email change@example.com --name "Change Example" --tenant "Acme Corporation" --password-stdin
          echo 'a-long-enough-password' | $db create-user --email capped@example.com --name "Capped Example" --password-stdin
          echo 'a-long-enough-password' | $db create-user --email expiry@example.com --name "Expiry Example" --password-stdin

          # The password rules (src/Db/Passwords/PasswordRules.cs): 12 to 128 characters, and not
          # the account's own email. The API uses the same rules.
          if echo 'eleven-char' | $db create-user --email rules@example.com --name Rules --password-stdin; then
            echo "create-user accepted an 11-character password."
            exit 1
          fi
          if printf 'a%.0s' $(seq 1 129) | $db create-user --email rules@example.com --name Rules --password-stdin; then
            echo "create-user accepted a 129-character password."
            exit 1
          fi
          if echo 'Rules@Example.com' | $db create-user --email rules@example.com --name Rules --password-stdin; then
            echo "create-user accepted the email address as the password."
            exit 1
          fi
          echo 'twelve-chars' | $db create-user --email rules@example.com --name Rules --password-stdin

          # Roles from the Db runner: the default, --role needing --tenant, and unknown roles.
          # (set-role refusing a demo account is in the sandbox checks, which make one.)
          $sqlcmd -Q "SET NOCOUNT ON; SELECT r.Name FROM dbo.TenantUsers AS tu JOIN dbo.Users AS u ON u.Id = tu.UserId JOIN dbo.Roles AS r ON r.Id = tu.RoleId JOIN dbo.Tenants AS t ON t.Id = tu.TenantId WHERE u.Email = 'mem@example.com' AND t.Name = 'Globex Industries';" | grep -qx 'Member'
          $sqlcmd -Q "SET NOCOUNT ON; SELECT r.Name FROM dbo.TenantUsers AS tu JOIN dbo.Users AS u ON u.Id = tu.UserId JOIN dbo.Roles AS r ON r.Id = tu.RoleId WHERE u.Email = 'ro@example.com';" | grep -qx 'Read-only'
          if echo 'a-long-enough-password' | $db create-user --email norole@example.com --name "No Role" --role Admin --password-stdin; then
            echo "create-user accepted --role without --tenant."
            exit 1
          fi
          if $db set-role --email mem@example.com --tenant "Acme Corporation" --role Owner 2> unknown-role.txt; then
            echo "set-role accepted a role that doesn't exist."
            exit 1
          fi
          grep -q "The roles are: Admin, Member, Read-only" unknown-role.txt

          # A password on the command line is refused outright.
          if $db set-password --email ann@example.com --password oops; then
            echo "set-password accepted a password argument."
            exit 1
          fi

          # Stored as a PHC string with the configured settings.
          $sqlcmd -Q "SET NOCOUNT ON; SELECT PasswordHash FROM dbo.Users WHERE Email = 'ann@example.com';" | grep -q '^\$argon2id\$v=19\$m=19456,t=2,p=1\$'
          $sqlcmd -Q "SET NOCOUNT ON; SELECT PasswordHash FROM dbo.Users WHERE Email = 'weak@example.com';" | grep -q '^\$argon2id\$v=19\$m=19456,t=1,p=1\$'

      # The API connects with its own login, which can read and write data but not change
      # the schema (sql/migrations/0005_app_runtime_role.sql). Prove both halves.
      - name: Create the API's login
        env:
          APP_DB_USER: dashboard_app
          APP_DB_PASSWORD: AppDevOnly!ChangeMe1
        run: |
          dotnet run --no-build --configuration Release --project src/Db -- app-user
          # Twice: the second run resets the password and must also succeed.
          dotnet run --no-build --configuration Release --project src/Db -- app-user

      - name: The API's login can read data but can't change the schema
        run: |
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -d DashboardStarter -U dashboard_app -P AppDevOnly!ChangeMe1"
          $sqlcmd -Q "SELECT COUNT(*) FROM dbo.Tenants;"
          if $sqlcmd -Q "CREATE TABLE dbo.ShouldNotExist (Id int);"; then
            echo "The app login was able to create a table."
            exit 1
          fi
          echo "CREATE TABLE was refused, as it should be."

      # Keeps running in the background for the sign-in and password checks. SessionCheckSeconds=2
      # lets the set-password check see the session end in seconds rather than a minute, and a
      # higher sign-in limit leaves room for the lockout checks before the rate-limit check.
      # Reset emails are written as files to .dev-mail (Development), where password-checks.sh
      # reads them; the password limit is raised so the checks don't hit it.
      - name: API starts and reports healthy (as the app login)
        env:
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=DashboardStarter;User Id=dashboard_app;Password=AppDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
          Auth__SessionCheckSeconds: "2"
          Auth__SignInPermitLimit: "50"
          PasswordReset__PermitLimit: "100"
          Email__DevFolder: ${{ github.workspace }}/.dev-mail
        run: |
          dotnet run --no-build --configuration Release --project src/Api > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:5080/api/health -o health.json; then
              break
            fi
            sleep 1
          done
          cat api.log
          cat health.json
          grep -q '"status":"Healthy"' health.json

      # Forgot, reset, and change password: the same answer for every address, emails only to
      # real accounts, single-use links, sessions ending, the hourly cap, and the password rules.
      # Before the sign-in checks, whose last check uses up this address's sign-in limit.
      - name: Password checks
        env:
          MAIL: ${{ github.workspace }}/.dev-mail
        run: bash .github/scripts/password-checks.sh

      # A second API with 2-second reset links, to see one expire. --urls on the command line,
      # because the launch profile would override ASPNETCORE_URLS.
      - name: Password reset links expire
        env:
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=DashboardStarter;User Id=dashboard_app;Password=AppDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
          PasswordReset__TokenLifetimeSeconds: "2"
          PasswordReset__PermitLimit: "100"
          Email__DevFolder: ${{ github.workspace }}/.dev-mail
          MAIL: ${{ github.workspace }}/.dev-mail
          BASE: http://localhost:5082
        run: |
          dotnet run --no-build --configuration Release --project src/Api -- --urls http://localhost:5082 > api-expiry.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:5082/api/health -o /dev/null; then
              break
            fi
            sleep 1
          done
          bash .github/scripts/password-checks.sh expiry || { cat api-expiry.log; exit 1; }
          kill $pid

      # Roles and permissions: 401 and 403, each role's permissions, changes taking effect for a
      # signed-in user, the self and last-admin rules (with two admins demoting each other at
      # once), and disabling one tenant only. Its own API instance, so its sign-ins don't count
      # toward the rate limit the sign-in checks use up.
      - name: Role checks
        env:
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=DashboardStarter;User Id=dashboard_app;Password=AppDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
          Auth__SessionCheckSeconds: "2"
          BASE: http://localhost:5083
          DB: dotnet run --no-build --configuration Release --project src/Db --
        run: |
          dotnet run --no-build --configuration Release --project src/Api -- --urls http://localhost:5083 > api-roles.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:5083/api/health -o /dev/null; then
              break
            fi
            sleep 1
          done
          bash .github/scripts/role-checks.sh || { cat api-roles.log; exit 1; }
          kill $pid

      # The Customers API (step 9): each role gets exactly its permissions, validation, paging,
      # search with LIKE's wildcards taken literally, 409 with the current record on a stale
      # RowVersion, soft delete (gone from every endpoint, row kept), tenant isolation, and the
      # demo row cap (200, deleted rows counted; real tenants uncapped).
      - name: Customer checks
        env:
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=DashboardStarter;User Id=dashboard_app;Password=AppDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
          BASE: http://localhost:5088
          SQLCMD: docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -I -h -1 -W -d DashboardStarter -U sa -P LocalDevOnly!ChangeMe1
        run: |
          dotnet run --no-build --configuration Release --project src/Api -- --urls http://localhost:5088 > api-customers.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:5088/api/health -o /dev/null; then
              break
            fi
            sleep 1
          done
          bash .github/scripts/customer-checks.sh || { cat api-customers.log; exit 1; }
          kill $pid

      # Row-Level Security, with sqlcmd and no API: the policy covers every table with a TenantId
      # (TenantUsers excepted), no tenant set means no rows and no writes, and one tenant's context
      # can't read or write another's. As the API's login and as the admin: neither is exempt.
      # Uses the customers the step above left in Acme and Globex.
      - name: Row-Level Security checks
        env:
          SQLCMD: docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -I -h -1 -W -d DashboardStarter -U sa -P LocalDevOnly!ChangeMe1
          SQLCMD_APP: docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -I -h -1 -W -d DashboardStarter -U dashboard_app -P AppDevOnly!ChangeMe1
        run: bash .github/scripts/rls-checks.sh

      # Demo sandboxes (src/Api/Demo): "Try the demo" makes exactly the expected rows; two clicks
      # are two sandboxes that can't see each other; the visitor can change members in Demo and
      # not in Other Demo; the Db runner won't give a demo account a password or a role; an
      # expired sandbox's session ends and cleanup removes every row it owned and nothing else;
      # use keeps a sandbox alive and signing out ends it; and the cleanup lock keeps a second
      # instance from cleaning at the same time. Cleanup every 2 seconds so it's quick to see.
      - name: Sandbox checks
        env:
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=DashboardStarter;User Id=dashboard_app;Password=AppDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
          Auth__SessionCheckSeconds: "2"
          Demo__CleanupInterval: "00:00:02"
          Demo__SandboxPermitLimit: "100"
          BASE: http://localhost:5085
          DB: dotnet run --no-build --configuration Release --project src/Db --
          SQLCMD: docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -I -h -1 -W -d DashboardStarter -U sa -P LocalDevOnly!ChangeMe1
        run: |
          dotnet run --no-build --configuration Release --project src/Api -- --urls http://localhost:5085 > api-sandbox.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:5085/api/health -o /dev/null; then
              break
            fi
            sleep 1
          done
          bash .github/scripts/sandbox-checks.sh || { cat api-sandbox.log; exit 1; }
          grep -q 'Demo cleanup skipped: another instance is running it.' api-sandbox.log
          kill $pid

      # The limits on the anonymous endpoint: a cap on active sandboxes (set here to one more than
      # exist now) and a rate limit per client address (3 here). The rate limiter counts every
      # attempt, refused or not: one sandbox, two "busy", then 429.
      - name: Sandbox limits (global cap and rate limit)
        env:
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=DashboardStarter;User Id=dashboard_app;Password=AppDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
          Demo__SandboxPermitLimit: "3"
          BASE: http://localhost:5084
        run: |
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -h -1 -W -d DashboardStarter -U sa -P LocalDevOnly!ChangeMe1"
          active=$($sqlcmd -Q "SET NOCOUNT ON; SELECT COUNT(*) / 2 FROM dbo.Tenants WHERE IsDemo = 1 AND ExpiresAt > SYSUTCDATETIME();")
          echo "Active sandboxes: $active"
          Demo__MaxActiveSandboxes=$((active + 1)) dotnet run --no-build --configuration Release --project src/Api -- --urls http://localhost:5084 > api-limits.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:5084/api/health -o /dev/null; then
              break
            fi
            sleep 1
          done
          source .github/scripts/lib.sh
          expect "$(start_demo "$work/1")" 204
          expect "$(start_demo "$work/2")" 503
          expect "$(json_field detail)" "The demo is busy, try again later."
          expect "$(start_demo "$work/3")" 503
          expect "$(start_demo "$work/4")" 429
          expect "$(json_field title)" "Too many demos started from here"
          kill $pid

      # With sandboxes on, the API refuses to start while a table could hold a sandbox's rows
      # that cleanup doesn't know about: a TenantId column, or a foreign key to Users or Tenants
      # (SandboxCleanup.CheckCoverageAsync). Two such tables are made here, as the admin; the
      # app login only reads their metadata.
      - name: Cleanup must cover every table a sandbox can own rows in
        env:
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=DashboardStarter;User Id=dashboard_app;Password=AppDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
        run: |
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -d DashboardStarter -U sa -P LocalDevOnly!ChangeMe1"
          $sqlcmd -Q "CREATE TABLE dbo.ProbeTenantRows (Id int NOT NULL, TenantId int NOT NULL);
            CREATE TABLE dbo.ProbeUserRows (Id int NOT NULL, OwnerId int NOT NULL REFERENCES dbo.Users (Id));"
          set +e
          timeout 60 dotnet run --no-build --configuration Release --project src/Api -- --urls http://localhost:5086 > api-coverage.log 2>&1
          code=$?
          set -e
          $sqlcmd -Q "DROP TABLE dbo.ProbeTenantRows; DROP TABLE dbo.ProbeUserRows;"
          cat api-coverage.log
          if [ "$code" -ne 1 ]; then
            echo "Expected the API to refuse to start (exit code 1), got $code."
            exit 1
          fi
          grep -q 'dbo.ProbeTenantRows.TenantId' api-coverage.log
          grep -q 'dbo.ProbeUserRows.OwnerId' api-coverage.log

      # Every permission the database grants is one the code knows (src/Db/Authorization/Permissions.cs),
      # and every permission in the code is granted to some role. A typo in either place fails here.
      - name: Permissions in the database match the code
        run: |
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -h -1 -W -d DashboardStarter -U sa -P LocalDevOnly!ChangeMe1"
          $sqlcmd -Q "SET NOCOUNT ON; SELECT DISTINCT Permission FROM dbo.RolePermissions " | LC_ALL=C sort > db-permissions.txt
          grep -o 'public const string [A-Za-z]* = "[a-z.]*"' src/Db/Authorization/Permissions.cs | sed 's/.*"\(.*\)"/\1/' | LC_ALL=C sort > code-permissions.txt
          echo "Database:"; cat db-permissions.txt
          echo "Code:"; cat code-permissions.txt
          diff code-permissions.txt db-permissions.txt

      # Sign in and out, wrong passwords, lockout, the demo account, antiforgery, switching
      # tenants, SESSION_CONTEXT, set-password ending a session, and the rate limit.
      - name: Sign-in checks
        env:
          DB: dotnet run --no-build --configuration Release --project src/Db --
        run: bash .github/scripts/auth-checks.sh

      - name: Signing in rehashed the weaker hash
        run: |
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -h -1 -W -d DashboardStarter -U sa -P LocalDevOnly!ChangeMe1"
          $sqlcmd -Q "SET NOCOUNT ON; SELECT PasswordHash FROM dbo.Users WHERE Email = 'weak@example.com';" | grep -q '^\$argon2id\$v=19\$m=19456,t=2,p=1\$'

      # Outside Development the API also serves the React build. Deep links (/health) must
      # get index.html, but a mistyped API path or a missing file must stay a real 404.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Build the front end into the API's wwwroot
        run: |
          npm ci --prefix src/Web
          npm run build --prefix src/Web
          mkdir -p src/Api/wwwroot
          cp -r src/Web/dist/. src/Api/wwwroot/

      # Also the production cookie and HTTPS settings. ASPNETCORE_FORWARDEDHEADERS_ENABLED is
      # what the deploy sets on App Service, so a request with X-Forwarded-Proto: https counts
      # as HTTPS here, the way one that came through Azure's front end does.
      - name: Production mode (SPA fallback, cookies, HSTS)
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5081
          ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=DashboardStarter;User Id=dashboard_app;Password=AppDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
        run: |
          # --no-launch-profile: the profile in launchSettings.json forces Development and port
          # 5080, which would ignore the settings above and clash with the API from the
          # previous step.
          dotnet run --no-build --no-launch-profile --configuration Release --project src/Api > api-prod.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:5081/api/health -o /dev/null; then
              break
            fi
            sleep 1
          done
          cat api-prod.log

          # A React route that isn't a file: 200 and the page.
          curl -sf http://localhost:5081/health | grep -q '<div id="root">'

          # Unknown API paths: 404 and JSON, never the page.
          status=$(curl -s -o api-404.json -w '%{http_code}' http://localhost:5081/api/nope)
          [ "$status" = "404" ]
          grep -q '"status":404' api-404.json
          # (An if, not "! grep": bash's -e ignores a command that starts with !, so that
          # form could never fail the step.)
          if grep -q '<div id="root">' api-404.json; then
            echo "An unknown API path got the page."
            exit 1
          fi

          # A missing file: a real 404, not the page.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5081/missing.js)
          [ "$status" = "404" ]

          # Signed out: the API answers 401 as JSON, never a redirect to a login page.
          status=$(curl -s -o me.json -w '%{http_code}' http://localhost:5081/api/auth/me)
          [ "$status" = "401" ]
          grep -q '"status":401' me.json

          # Sandboxes and email are off unless configured: the sign-in page shows neither
          # "Try the demo" nor "Forgot password?".
          curl -sf http://localhost:5081/api/auth/sign-in-info -o sign-in-info.json
          grep -q '"demo":null' sign-in-info.json
          grep -q '"emailEnabled":false' sign-in-info.json

          # With sandboxes off there's no endpoint and no cleanup service: a fork never gets an
          # anonymous button that creates accounts unless it asks for one. Over (forwarded) HTTPS:
          # Production's antiforgery cookie is Secure, so a plain HTTP request gets a 500.
          https="-H X-Forwarded-Proto:https"
          curl -sf $https -c off-jar -b off-jar -o /dev/null http://localhost:5081/api/auth/antiforgery
          status=$(curl -s $https -o off.json -w '%{http_code}' -c off-jar -b off-jar -X POST \
            -H "X-XSRF-TOKEN: $(awk '$6 ~ /ds-xsrf$/ { print $7 }' off-jar)" http://localhost:5081/api/demo/sandbox)
          [ "$status" = "404" ]
          if grep -q 'Demo cleanup' api-prod.log; then
            echo "The cleanup service ran with sandboxes off."
            exit 1
          fi

          # Every response asks the browser not to send a Referer to other sites.
          curl -sI http://localhost:5081/api/health | grep -qi '^referrer-policy: no-referrer'

          # Deployed cookies: __Host- names, Secure, HttpOnly where script mustn't read them.
          curl -sf $https -D af.txt -c jar -b jar -o /dev/null http://localhost:5081/api/auth/antiforgery
          cat af.txt
          grep -qi '^set-cookie: __Host-ds-af=.*; secure; samesite=strict; httponly' af.txt
          grep -qi '^set-cookie: __Host-ds-xsrf=.*; secure; samesite=strict' af.txt
          token=$(awk '$6 == "__Host-ds-xsrf" { print $7 }' jar)
          curl -s $https -D signin.txt -c jar -b jar -o /dev/null -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            -d '{"email":"boss@example.com","password":"a-long-enough-password"}' http://localhost:5081/api/auth/sign-in
          cat signin.txt
          grep -q '^HTTP/1.1 200' signin.txt
          grep -qi '^set-cookie: __Host-ds-auth=.*; secure; samesite=lax; httponly' signin.txt
          curl -sf $https -b jar http://localhost:5081/api/auth/me | grep -q '"email":"boss@example.com"'

          # HSTS on HTTPS requests, without includeSubDomains or preload. (Never sent to
          # localhost, so this asks for another host name.)
          curl -s $https -H 'Host: dashboard.example.com' -D hsts.txt -o /dev/null http://localhost:5081/api/health
          grep -i '^strict-transport-security: max-age=31536000' hsts.txt
          if grep -qi 'includesubdomains\|preload' hsts.txt; then
            echo "HSTS must not include subdomains or preload."
            exit 1
          fi

      # A database that has the step 7 shared demo account, made by step 7's own code (pinned
      # to the step 7 commit), then migrated by this build: migration 0012 marks its five users
      # and two tenants expired, and the API's first cleanup run removes them, leaving the
      # real tenants alone. Its own database, so the checks above aren't affected.
      - name: Upgrade from step 7 (the shared demo account goes away)
        env:
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=UpgradeCheck;User Id=sa;Password=LocalDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
          DOTNET_ENVIRONMENT: Development
        run: |
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -h -1 -W -d UpgradeCheck -U sa -P LocalDevOnly!ChangeMe1"
          step7=a846d63255993448555ef659b9ce2d3ddf9cb4e6
          git fetch --no-tags --depth 1 origin "$step7"
          git worktree add ../step7 "$step7"
          (cd ../step7 && dotnet build src/Db --configuration Release && \
            dotnet run --no-build --configuration Release --project src/Db -- migrate && \
            dotnet run --no-build --configuration Release --project src/Db -- seed)
          shared="'guest@example.com', 'sam.rivera@example.com', 'priya.shah@example.com', 'lee.chen@example.com', 'jordan.blake@example.com'"
          [ "$($sqlcmd -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Users WHERE Email IN ($shared);")" = 5 ]

          dotnet run --no-build --configuration Release --project src/Db -- migrate
          [ "$($sqlcmd -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Users WHERE Email IN ($shared) AND ExpiresAt <= SYSUTCDATETIME();")" = 5 ]
          [ "$($sqlcmd -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Tenants WHERE IsDemo = 1 AND ExpiresAt <= SYSUTCDATETIME();")" = 2 ]

          dotnet run --no-build --configuration Release --project src/Api -- --urls http://localhost:5087 > api-upgrade.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 60); do
            if grep -q 'Demo cleanup removed' api-upgrade.log; then
              break
            fi
            sleep 1
          done
          kill $pid
          cat api-upgrade.log
          grep -q 'Demo cleanup removed 2 tenant(s), 5 user(s)' api-upgrade.log
          [ "$($sqlcmd -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Users WHERE Email IN ($shared);")" = 0 ]
          [ "$($sqlcmd -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Tenants WHERE Name IN ('Demo', 'Other Demo');")" = 0 ]
          [ "$($sqlcmd -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Tenants WHERE Name IN ('Acme Corporation', 'Globex Industries');")" = 2 ]

      # A database made by step 8's own code (pinned to the step 8 commit), with a visitor signed in
      # to a sandbox, migrated by this build. While step 8's API is still running, as it is during
      # a deploy (migrate runs before the new code starts), it keeps working against the new schema.
      # Then this build's API: the old sandbox's session still works and can add customers, and
      # cleanup removes that sandbox, customers included, with the policy on. Its own database.
      - name: Upgrade from step 8 (Customers and Row-Level Security arrive)
        env:
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=UpgradeStep8;User Id=sa;Password=LocalDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
          DOTNET_ENVIRONMENT: Development
          Demo__CleanupInterval: "00:00:02"
          Auth__SessionCheckSeconds: "2"
        run: |
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -I -h -1 -W -d UpgradeStep8 -U sa -P LocalDevOnly!ChangeMe1"
          wait_for() { for attempt in $(seq 1 60); do curl -sf "$1/api/health" -o /dev/null && return 0; sleep 1; done; return 1; }
          step8=a1cf804a1a4aba468b37ff1606a087737cd33563
          git fetch --no-tags --depth 1 origin "$step8"
          git worktree add ../step8 "$step8"
          (cd ../step8 && dotnet build src/Api --configuration Release && \
            dotnet run --no-build --configuration Release --project src/Db -- migrate && \
            dotnet run --no-build --configuration Release --project src/Db -- seed)
          (cd ../step8 && dotnet run --no-build --configuration Release --project src/Api -- --urls http://localhost:5089) > api-step8.log 2>&1 &
          wait_for http://localhost:5089
          source .github/scripts/lib.sh
          BASE=http://localhost:5089
          expect "$(start_demo "$work/old")" 204

          dotnet run --no-build --configuration Release --project src/Db -- migrate
          [ "$($sqlcmd -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.security_policies WHERE name = N'TenantAccessPolicy' AND is_enabled = 1;")" = 1 ]
          echo "Step 8's API on the new schema:"
          expect "$(status "$work/old" "$BASE/api/members")" 200
          expect "$(start_demo "$work/old2")" 204
          pkill -f 'localhost:5089' || true

          dotnet run --no-build --configuration Release --project src/Api -- --urls http://localhost:5090 > api-upgrade8.log 2>&1 &
          pid=$!
          wait_for http://localhost:5090 || { cat api-upgrade8.log; exit 1; }
          BASE=http://localhost:5090
          echo "The step 8 sandbox, in this build:"
          expect "$(status "$work/old" "$BASE/api/auth/me")" 200
          old_tenant=$(field currentTenantId)
          expect "$(status "$work/old" "$BASE/api/customers")" 200
          grep -q '"total":0' "$body"
          expect "$(post "$work/old" /api/customers '{"name":"Added after the upgrade","status":"Active"}')" 201
          expect "$(post "$work/old" /api/auth/sign-out)" 204
          for attempt in $(seq 1 30); do
            if [ "$($sqlcmd -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Tenants WHERE Id = $old_tenant;")" = 0 ]; then break; fi
            sleep 1
          done
          kill $pid
          cat api-upgrade8.log
          [ "$($sqlcmd -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Tenants WHERE Id = $old_tenant;")" = 0 ]
          [ "$($sqlcmd -Q "SET NOCOUNT ON; EXEC sp_set_session_context @key = N'TenantId', @value = $old_tenant; SELECT COUNT(*) FROM dbo.Customers;")" = 0 ]
          if grep -q 'Demo cleanup failed' api-upgrade8.log; then echo "Cleanup failed."; exit 1; fi

      # Data migrations on a tenant-owned table, on the database from the step above (it has real
      # tenants and a demo sandbox). Written the obvious way, a data step sees no rows (no tenant
      # in SESSION_CONTEXT) and quietly changes nothing; with "-- for-each-tenant" as its first
      # line the runner runs it once per tenant, in that tenant, in one transaction, and a failure
      # in any tenant rolls it back in all of them. The probe migrations only exist in this job.
      - name: Data migrations run per tenant with -- for-each-tenant
        env:
          ConnectionStrings__Default: Server=127.0.0.1,1433;Database=UpgradeStep8;User Id=sa;Password=LocalDevOnly!ChangeMe1;Encrypt=True;TrustServerCertificate=True
          DOTNET_ENVIRONMENT: Development
        run: |
          sqlcmd="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -C -b -I -h -1 -W -d UpgradeStep8 -U sa -P LocalDevOnly!ChangeMe1"
          in_tenant() { $sqlcmd -Q "SET NOCOUNT ON; EXEC sp_set_session_context @key = N'TenantId', @value = $1; $2"; }
          tenants=$($sqlcmd -Q "SET NOCOUNT ON; SELECT Id FROM dbo.Tenants ORDER BY Id;")
          count=$(echo "$tenants" | wc -l)
          last=$(echo "$tenants" | tail -1)
          echo "Tenants: $(echo $tenants)"
          [ "$count" -ge 3 ]
          for t in $tenants; do
            in_tenant "$t" "INSERT INTO dbo.Customers (TenantId, Name) VALUES ($t, N'Probe one'), ($t, N'Probe two');"
          done

          cat > sql/migrations/9001_probe_no_tenant.sql <<'SQL'
          -- Written the obvious way: no tenant is set, so Row-Level Security shows it no rows.
          UPDATE dbo.Customers SET Notes = N'no tenant' WHERE Notes IS NULL;
          SQL
          cat > sql/migrations/9002_probe_for_each_tenant.sql <<'SQL'
          -- for-each-tenant
          UPDATE dbo.Customers
          SET Notes = CONCAT(N'tenant ', TenantId)
          WHERE TenantId = CAST(SESSION_CONTEXT(N'TenantId') AS int)
            AND Notes IS NULL;
          SQL
          dotnet build src/Db --configuration Release
          output=$(dotnet run --no-build --configuration Release --project src/Db -- migrate)
          echo "$output"
          echo "$output" | grep -q "applied  9001_probe_no_tenant.sql$"
          echo "$output" | grep -q "applied  9002_probe_for_each_tenant.sql (for each tenant: $count)"
          for t in $tenants; do
            [ "$(in_tenant "$t" "SELECT COUNT(*) FROM dbo.Customers WHERE Notes = N'no tenant';")" = 0 ]
            [ "$(in_tenant "$t" "SELECT COUNT(*) FROM dbo.Customers WHERE Name LIKE N'Probe %' AND Notes = CONCAT(N'tenant ', $t);")" = 2 ]
          done
          # Nothing is left in SESSION_CONTEXT for the scripts after it: the policy script reran fine.
          echo "$output" | grep -q "applied  Security.fn_TenantAccessPredicate.sql"

          # Fails in the last tenant: rolled back everywhere, and the error names the tenant.
          cat > sql/migrations/9003_probe_fails.sql <<'SQL'
          -- for-each-tenant
          UPDATE dbo.Customers SET Notes = N'half done' WHERE TenantId = CAST(SESSION_CONTEXT(N'TenantId') AS int);
          GO
          IF CAST(SESSION_CONTEXT(N'TenantId') AS int) = (SELECT MAX(Id) FROM dbo.Tenants)
          BEGIN
            THROW 50000, N'Probe failure in the last tenant.', 1;
          END
          SQL
          dotnet build src/Db --configuration Release
          set +e
          output=$(dotnet run --no-build --configuration Release --project src/Db -- migrate)
          code=$?
          set -e
          echo "$output"
          [ "$code" = 1 ]
          echo "$output" | grep -q "failed   9003_probe_fails.sql (tenant $last, batch 2 of 2"
          for t in $tenants; do
            [ "$(in_tenant "$t" "SELECT COUNT(*) FROM dbo.Customers WHERE Notes = N'half done';")" = 0 ]
          done
          rm sql/migrations/9001_probe_no_tenant.sql sql/migrations/9002_probe_for_each_tenant.sql sql/migrations/9003_probe_fails.sql

      - name: Editing an applied migration makes migrate fail
        run: |
          echo "-- edited after it was applied" >> sql/migrations/0001_tenants.sql
          dotnet build src/Db --configuration Release
          set +e
          output=$(dotnet run --no-build --configuration Release --project src/Db -- migrate)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 1 ]; then
            echo "Expected migrate to exit with code 1, got $code."
            exit 1
          fi
          echo "$output" | grep -q "edited after it was applied"

  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  # Ships main to Azure once both checks pass (.github/workflows/deploy.yml).
  # Runs on a push to main, or a manual run of CI on main. Skipped on pull requests, and
  # in any fork that hasn't set up its own Azure (no AZURE_WEBAPP_NAME variable), so forks
  # stay green without an Azure account.
  deploy:
    name: deploy
    needs: [dotnet, web]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
